[project]
name = "runner-service"
version = "0.1.0"
description = ""
authors = [
    {name = "akhmad",email = "akhmad@mail.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)"
]
