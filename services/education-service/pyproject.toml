[project]
name = "education-service"
version = "0.1.0"
description = ""
authors = [
    {name = "akhmad",email = "akhmad@mail.ru"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi (>=0.142.0,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aio-pika (>=10.1.0,<11.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "python-slugify (>=9.1.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
