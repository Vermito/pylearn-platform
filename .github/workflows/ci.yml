name: PyLearn CI/CD


on:
  push:

  pull_request:

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: pylearn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ========================================================
  # LINT + TESTS
  # ========================================================

  quality:
    name: "${{ matrix.service }} — Ruff & pytest"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - auth-service
          - education-service
          - progress-service
          - runner-service


    # ------------------------------------------------------
    # PostgreSQL
    #
    # Нужен прежде всего auth-service integration tests.
    # Для остальных matrix jobs контейнер безвреден.
    # ------------------------------------------------------

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: pylearn
          POSTGRES_PASSWORD: pylearn_ci_password
          POSTGRES_DB: auth_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U pylearn -d auth_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10


    # ------------------------------------------------------
    # Environment
    # ------------------------------------------------------

    env:
      # ==========================
      # JWT
      # ==========================

      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7


      # ==========================
      # AUTH DATABASE
      # ==========================

      AUTH_DB_USER: pylearn
      AUTH_DB_PASSWORD: pylearn_ci_password
      AUTH_DB_NAME: auth_test_db
      AUTH_DB_HOST: localhost
      AUTH_DB_PORT: 5432


      # ==========================
      # AUTH TEST DATABASE
      # ==========================

      AUTH_TEST_DB_USER: pylearn
      AUTH_TEST_DB_PASSWORD: pylearn_ci_password
      AUTH_TEST_DB_NAME: auth_test_db
      AUTH_TEST_DB_HOST: localhost
      AUTH_TEST_DB_PORT: 5432


      # ==========================
      # EDUCATION DATABASE
      #
      # Education unit tests use
      # mocks, therefore a real
      # DB is not required.
      # ==========================

      EDUCATION_DB_USER: pylearn
      EDUCATION_DB_PASSWORD: ci_password
      EDUCATION_DB_NAME: education_db
      EDUCATION_DB_HOST: localhost
      EDUCATION_DB_PORT: 5434


      # ==========================
      # PROGRESS DATABASE
      # ==========================

      PROGRESS_DB_USER: pylearn
      PROGRESS_DB_PASSWORD: ci_password
      PROGRESS_DB_NAME: progress_db
      PROGRESS_DB_HOST: localhost
      PROGRESS_DB_PORT: 5435


      # ==========================
      # RABBITMQ
      # ==========================

      RABBITMQ_USER: pylearn
      RABBITMQ_PASSWORD: ci_password
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: /


      # ==========================
      # REDIS
      # ==========================

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_TTL_SECONDS: 300


      # ==========================
      # RUNNER
      # ==========================

      RUNNER_API_KEY: ${{ secrets.RUNNER_API_KEY }}
      RUNNER_SERVICE_URL: http://127.0.0.1:8003


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ----------------------------------------------------
      # Verify secrets are present
      #
      # Временно можно оставить для отладки.
      # Значения секретов НЕ выводятся в лог.
      # ----------------------------------------------------

      - name: Verify secrets are present
        shell: bash
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::JWT_SECRET is empty or not set!"
            exit 1
          fi
          if [ -z "${{ secrets.RUNNER_API_KEY }}" ]; then
            echo "::error::RUNNER_API_KEY is empty or not set!"
            exit 1
          fi
          echo "Both secrets are set (values hidden)"


      # ----------------------------------------------------
      # Poetry
      #
      # pip ставит исполняемый файл poetry в ~/.local/bin,
      # который по умолчанию отсутствует в PATH.
      # Добавляем его через $GITHUB_PATH — это официальный
      # способ сохранить PATH между шагами.
      # ----------------------------------------------------

      - name: Install Poetry
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      - name: Display versions
        run: |
          python --version
          poetry --version


      # ----------------------------------------------------
      # Dependencies
      # ----------------------------------------------------

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}

        run: |
          poetry install \
            --with dev \
            --no-interaction \
            --no-root


      # ----------------------------------------------------
      # Ruff
      # ----------------------------------------------------

      - name: Ruff
        working-directory: services/${{ matrix.service }}

        run: |
          poetry run ruff check \
            app \
            tests \
            --config ../../ruff.toml \
            --output-format=github


      # ----------------------------------------------------
      # Auth database migrations
      # ----------------------------------------------------

      - name: Run auth migrations
        if: matrix.service == 'auth-service'

        working-directory: services/auth-service

        run: |
          poetry run alembic upgrade head


      # ----------------------------------------------------
      # Pytest
      # ----------------------------------------------------

      - name: Run tests
        working-directory: services/${{ matrix.service }}

        run: |
          poetry run pytest \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml


      # ----------------------------------------------------
      # Store coverage XML
      # ----------------------------------------------------

      - name: Upload coverage
        uses: actions/upload-artifact@v4

        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore


  # ========================================================
  # DOCKER BUILD VALIDATION
  # ========================================================

  docker-build:
    name: Validate Docker images

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      fail-fast: false

      matrix:
        include:

          - service: auth-service
            image: pylearn-auth

          - service: education-service
            image: pylearn-education

          - service: progress-service
            image: pylearn-progress

          - service: runner-service
            image: pylearn-runner


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.image }}:ci \
            ./services/${{ matrix.service }}


  # ========================================================
  # CONTINUOUS DELIVERY
  #
  # Выполняется только для push в main.
  #
  # После успешных:
  # Ruff
  # pytest
  # Docker build
  #
  # публикуем изображения в GHCR.
  # ========================================================

  publish:
    name: Publish ${{ matrix.image }}

    runs-on: ubuntu-latest

    needs:
      - quality
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write


    strategy:
      fail-fast: false

      matrix:
        include:

          - service: auth-service
            image: auth-service

          - service: education-service
            image: education-service

          - service: progress-service
            image: progress-service

          - service: runner-service
            image: runner-service


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ----------------------------------------------------
      # Calculate GHCR image name
      # ----------------------------------------------------

      - name: Prepare image name
        id: image

        shell: bash

        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo \
            "name=ghcr.io/${OWNER}/pylearn-${{ matrix.image }}" \
            >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------
      # Docker Build + Push
      # ----------------------------------------------------

      - name: Build and push image
        uses: docker/build-push-action@v7

        with:
          context: ./services/${{ matrix.service }}

          push: true

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}


      # ----------------------------------------------------
      # Result
      # ----------------------------------------------------

      - name: Published image
        run: |
          echo "Published:"
          echo "${{ steps.image.outputs.name }}:latest"
          echo "${{ steps.image.outputs.name }}:${{ github.sha }}"