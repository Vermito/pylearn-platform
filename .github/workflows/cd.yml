name: CD


on:
  # Автоматический запуск после успешного CI на push в main
  workflow_run:
    workflows:
      - CI

    types:
      - completed

  # Ручной запуск из UI
  workflow_dispatch:


permissions:
  contents: read
  packages: write


concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false


jobs:

  publish-images:
    name: Publish ${{ matrix.image }}

    # Запускаемся только если:
    #   - это workflow_run (не ручной запуск), и
    #   - CI завершился успешно, и
    #   - это push в main
    # При workflow_dispatch условие пропускается
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest


    strategy:
      fail-fast: false

      matrix:
        include:

          - service: auth-service
            image: pylearn-auth-service

          - service: education-service
            image: pylearn-education-service

          - service: progress-service
            image: pylearn-progress-service

          - service: runner-service
            image: pylearn-runner-service


    steps:

      # =====================================================
      # CHECKOUT
      #
      # Если запущено через workflow_run — берём тот же SHA,
      # что прошёл CI. Иначе (ручной запуск) — текущий HEAD.
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6

        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}


      # =====================================================
      # LOWERCASE OWNER
      # =====================================================

      - name: Prepare image owner
        id: vars
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"


      # =====================================================
      # DOCKER BUILDX
      # =====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # =====================================================
      # GHCR LOGIN
      # =====================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # =====================================================
      # BUILD + PUSH
      # =====================================================

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6

        with:
          context: ./services/${{ matrix.service }}

          file: ./services/${{ matrix.service }}/Dockerfile

          push: true

          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ steps.vars.outputs.sha }}

          cache-from: |
            type=gha,scope=${{ matrix.service }}

          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}