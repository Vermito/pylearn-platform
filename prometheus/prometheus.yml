global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"


  - job_name: "auth-service"

    metrics_path: /metrics/

    static_configs:
      - targets:
          - "auth-service:8000"


  - job_name: "education-service"

    metrics_path: /metrics/

    static_configs:
      - targets:
          - "education-service-1:8001"
          - "education-service-2:8001"


  - job_name: "progress-service"

    metrics_path: /metrics/

    static_configs:
      - targets:
          - "progress-service:8002"


  - job_name: "runner-service"

    metrics_path: /metrics/

    static_configs:
      - targets:
          - "runner-service:8003"