user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log notice;

pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;

    default_type application/json;

    sendfile on;

    keepalive_timeout 65;

    server_tokens off;


    # =====================================================
    # LOGGING
    # =====================================================

    log_format pylearn_main
        '$remote_addr - $remote_user '
        '[$time_local] '
        '"$request" '
        '$status $body_bytes_sent '
        '"$http_referer" '
        '"$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log pylearn_main;


    # =====================================================
    # RATE LIMITING
    # =====================================================

    # Общий API:
    # 20 запросов в секунду на IP.
    limit_req_zone
        $binary_remote_addr
        zone=api_limit:10m
        rate=20r/s;

    # Auth endpoints ограничиваем сильнее.
    limit_req_zone
        $binary_remote_addr
        zone=auth_limit:10m
        rate=5r/s;

    limit_req_status 429;


    # =====================================================
    # UPSTREAMS
    # =====================================================

    upstream auth_backend {
        server auth-service:8000
            max_fails=3
            fail_timeout=30s;

        keepalive 16;
    }


    upstream education_backend {
        # Nginx использует round-robin
        # по умолчанию.
        server education-service-1:8001
            max_fails=3
            fail_timeout=30s;

        server education-service-2:8001
            max_fails=3
            fail_timeout=30s;

        keepalive 32;
    }


    upstream progress_backend {
        server progress-service:8002
            max_fails=3
            fail_timeout=30s;

        keepalive 16;
    }


    # =====================================================
    # SERVER
    # =====================================================

    server {
        listen 80;

        server_name _;

        client_max_body_size 1m;


        # =================================================
        # NGINX HEALTH
        # =================================================

        location = /health {
            default_type application/json;

            return 200
                '{"status":"ok","service":"nginx-gateway"}';
        }


        # =================================================
        # ROOT
        # =================================================

        location = / {
            default_type application/json;

            return 200
                '{"name":"PyLearn API Gateway","status":"ok","docs":{"auth":"/api/auth/docs","education":"/api/education/docs","progress":"/api/progress/docs"}}';
        }


        # =================================================
        # AUTH
        #
        # External:
        # /api/auth/login
        #
        # Internal:
        # /auth/login
        # =================================================

        location = /api/auth/login {
            limit_req
                zone=auth_limit
                burst=10
                nodelay;

            rewrite
                ^/api/auth/(.*)$
                /auth/$1
                break;

            proxy_pass http://auth_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        location = /api/auth/register {
            limit_req
                zone=auth_limit
                burst=10
                nodelay;

            rewrite
                ^/api/auth/(.*)$
                /auth/$1
                break;

            proxy_pass http://auth_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        location = /api/auth/refresh {
            limit_req
                zone=auth_limit
                burst=10
                nodelay;

            rewrite
                ^/api/auth/(.*)$
                /auth/$1
                break;

            proxy_pass http://auth_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        # Остальной auth-service:
        #
        # /api/auth/users/me
        #       ↓
        # /users/me
        #
        # /api/auth/admin/users
        #       ↓
        # /admin/users

        location /api/auth/ {
            limit_req
                zone=api_limit
                burst=40
                nodelay;

            rewrite
                ^/api/auth(/.*)$
                $1
                break;

            proxy_pass http://auth_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        # =================================================
        # EDUCATION
        #
        # /api/education/courses
        #       ↓
        # /courses
        # =================================================

        location /api/education/ {
            limit_req
                zone=api_limit
                burst=40
                nodelay;

            rewrite
                ^/api/education(/.*)$
                $1
                break;

            proxy_pass http://education_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;

            # Runner может выполнять код несколько секунд.
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_next_upstream
                error
                timeout
                http_502
                http_503
                http_504;

            proxy_next_upstream_tries 2;

            # Удобно для демонстрации
            # load balancing на защите.
            add_header
                X-PyLearn-Upstream
                $upstream_addr
                always;
        }


        # =================================================
        # PROGRESS
        #
        # /api/progress/stats/me
        #       ↓
        # /stats/me
        # =================================================

        location /api/progress/ {
            limit_req
                zone=api_limit
                burst=40
                nodelay;

            rewrite
                ^/api/progress(/.*)$
                $1
                break;

            proxy_pass http://progress_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        # =================================================
        # 404
        # =================================================

        location / {
            default_type application/json;

            return 404
                '{"detail":"Route not found"}';
        }
    }
}